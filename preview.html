<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TURN $30 INTO $1000</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    /* WhatsApp-style gradient background */
    background: linear-gradient(135deg, #d4f8d4, #a0e3a0);
}

/* Card */
.card {
    background: #fff;
    width: 320px;
    padding: 30px 20px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* Profile image */
.profile {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
}

/* Name */
h2 {
    margin: 15px 0 5px;
}

/* Username */
.username {
    color: #777;
    font-size: 14px;
}

/* Bio */
.bio {
    margin: 15px 0;
    font-size: 15px;
}

/* Button */
.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 25px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
}

.btn:hover {
    background: #1ebe5d;
}
</style>

</head>
<body>

<div class="card">

    <img src="ads.jpg" class="profile">

    <h2>TURN $30 TO $1000</h2>
    <div class="username">TURN $30 TO $1000</div>

    <div class="bio">
        JOIN $30 TO $1000 IN 30 DAYS 
    </div>

    <a href="https://chat.whatsapp.com/Fr1VqrBQnw5IsnvnGpIPeL?mode=gi_t" class="btn">

</body>
